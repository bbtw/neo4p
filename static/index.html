<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Planning</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">

      <header class="app-header">
        <span class="app-title">Financial Planning</span>
        <button class="search-trigger" id="search-trigger" aria-label="Search">
          <span class="search-icon">⌕</span>
          <span class="search-placeholder">Search needs, subneeds, tasks…</span>
          <kbd>⌘K</kbd>
        </button>
        <button class="overflow-btn" id="overflow-btn" aria-label="More actions" title="Load / Export / Wipe">···</button>
      </header>

      <div class="main">
        <div class="stage" id="stage"></div>
        <aside class="detail-drawer" id="detail-drawer" aria-label="Detail"></aside>
      </div>

    </div>

    <!-- Search overlay -->
    <div class="search-overlay hidden" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-dialog">
        <input class="search-input" id="search-input" type="search"
               placeholder="Search needs, subneeds, tasks…" autocomplete="off" spellcheck="false">
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="search-backdrop" id="search-backdrop"></div>
    </div>

    <!-- Overflow menu (Load / Export / Wipe) -->
    <div class="overflow-menu hidden" id="overflow-menu">
      <button id="load-json">Load JSON</button>
      <button id="export-json">Export JSON</button>
      <button id="wipe-graph" class="danger">Wipe Graph</button>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/app.js"></script>
  </body>
</html>
