<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Planning Graph</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Planning Graph</h1>
          <input id="search" type="search" placeholder="Search nodes…">
        </div>
        <nav id="hierarchy" class="hierarchy" aria-label="Planning hierarchy"></nav>
      </aside>

      <main class="workspace">
        <section class="toolbar" aria-label="Graph summary">
          <div class="metrics">
            <div class="metric-group">
              <span class="metric" id="need-count">0</span>
              <span class="metric-label">Needs</span>
            </div>
            <div class="metric-group">
              <span class="metric" id="subneed-count">0</span>
              <span class="metric-label">Subneeds</span>
            </div>
            <div class="metric-group">
              <span class="metric" id="task-count">0</span>
              <span class="metric-label">Tasks</span>
            </div>
          </div>
          <div class="graph-actions" aria-label="Graph actions">
            <button id="load-json" type="button">Load JSON</button>
            <button id="export-json" type="button">Export JSON</button>
            <button id="wipe-graph" class="danger" type="button">Wipe Graph</button>
          </div>
        </section>

        <section class="graph-shell">
          <div class="tree-canvas" id="tree-canvas">
            <svg id="connector-layer" aria-hidden="true"></svg>
          </div>
        </section>
      </main>

      <aside class="detail">
        <div class="detail-header">
          <h2 id="detail-title">Select a node</h2>
          <p id="detail-type" class="pill">No selection</p>
        </div>
        <div class="detail-body">
          <p id="detail-description">Choose a need, subneed, or task to review its relationships.</p>
          <div class="detail-section">
            <h3>Parents</h3>
            <ul id="parents"></ul>
          </div>
          <div class="detail-section">
            <h3>Children</h3>
            <ul id="children"></ul>
          </div>
        </div>
      </aside>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
