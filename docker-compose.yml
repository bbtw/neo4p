version: '3.9'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fastapi
    ports:
      - "8000:8000"
    networks:
      - webnet
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=your_password

  dash:
    build:
      context: .
      dockerfile: Dockerfile.dash
    container_name: dash
    ports:
      - "8050:8050"
    networks:
      - webnet
    environment:
      - API_BASE=http://fastapi:8000/api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
      - dash
    networks:
      - webnet


  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/your_password
    networks:
      - webnet

  seed:
      build:
        context: .
        dockerfile: Dockerfile.seed
      depends_on:
        - neo4j
      networks:
        - webnet

networks:
  webnet: