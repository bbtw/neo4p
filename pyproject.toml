[project]
name = "neo4p"
version = "0.1.0"
description = "Snapshot and validate a Neo4j planning graph with NetworkX"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=6.2.0",
    "networkx>=3.4.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
